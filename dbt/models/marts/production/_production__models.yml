version: 2

models:
  - name: fct_production_batches
    description: >
      Production batches (manufacturing customers). Grain: one row per batch per tenant.
      material_cost comes from the ERP's consumed-materials records; waste_rate = waste units / material units.
    columns:
      - name: production_key
        tests: [unique, not_null]
      - name: production_date
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
              config: {severity: warn}
      - name: tenant_id
        tests:
          - relationships: {to: ref('dim_tenant'), field: tenant_id}
      - name: output_units
        description: >
          Total units of ALL finished products made in the batch (a batch can make 2–3 different products).
          The batch header quantity in the ERP covers only the main product, so it understates output.
      - name: material_cost_per_unit
        description: >
          BLENDED average: batch material cost / all units made. The ERP records material cost per batch,
          not per product, so this is not a per-product cost (a 1L bottle and an 80ml bottle count the same).

  - name: fct_production_outputs
    description: "Finished products made. Grain: one row per finished product per batch."
    columns:
      - name: production_output_key
        tests: [unique, not_null]
      - name: production_key
        tests:
          - relationships: {to: ref('fct_production_batches'), field: production_key}
      - name: product_key
        tests:
          - relationships:
              to: ref('dim_product')
              field: product_key
              config: {severity: warn}
