version: 2

models:
  - name: stg_erp__sales
    description: "Sales invoices. Grain: one row per sale per tenant. Soft-deleted rows kept, flagged by is_deleted."
    columns:
      - name: sale_key
        description: "tenant_id || '-' || source id; unique across all tenants."
        tests: [unique, not_null]
      - name: tenant_id
        tests:
          - not_null
          - relationships: {to: ref('tenants'), field: tenant_id}
      - name: sale_date
        tests: [not_null]
      - name: sale_status
        tests:
          - accepted_values:
              values: ['completed', 'pending', 'ordered']
              config: {severity: warn}
      - name: payment_status
        tests:
          - accepted_values:
              values: ['paid', 'partial', 'unpaid']
              config: {severity: warn}
      - name: grand_total
        tests: [not_null]

  - name: stg_erp__sale_details
    description: "Sale lines. Grain: one row per product line on a sale per tenant."
    columns:
      - name: sale_line_key
        tests: [unique, not_null]
      - name: sale_key
        tests:
          - not_null
          - relationships: {to: ref('stg_erp__sales'), field: sale_key}
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('stg_erp__products')
              field: product_key
              config: {severity: warn}

  - name: stg_erp__products
    description: "Product catalogue. Grain: one row per product per tenant."
    columns:
      - name: product_key
        tests: [unique, not_null]
      - name: product_name
        tests: [not_null]

  - name: stg_erp__product_warehouse
    description: "Current stock on hand. Grain: one row per product (variant) per warehouse per tenant."
    columns:
      - name: product_warehouse_key
        tests: [unique, not_null]
      - name: product_key
        tests: [not_null]
      - name: warehouse_key
        tests: [not_null]

  - name: stg_erp__categories
    description: "Product categories. Grain: one row per category per tenant."
    columns:
      - name: category_key
        tests: [unique, not_null]

  - name: stg_erp__warehouses
    description: "Warehouses / stores. Contact details removed (ADR 0003)."
    columns:
      - name: warehouse_key
        tests: [unique, not_null]

  - name: stg_erp__clients
    description: "Buyers. All personal data removed or hashed (ADR 0003)."
    columns:
      - name: client_key
        tests: [unique, not_null]
      - name: client_name_hash
        description: "md5 of tenant + lower-cased name; for duplicate detection only."

  - name: stg_erp__settings
    description: "One row per tenant: source currency vs. reporting currency from the tenants seed."
    columns:
      - name: tenant_id
        tests: [unique, not_null]
      - name: has_currency_mismatch
        description: "True when the ERP's configured currency code differs from the reporting currency."

  - name: stg_erp__brands
    description: "Product brands. Grain: one row per brand per tenant."
    columns:
      - name: brand_key
        tests: [unique, not_null]

  - name: stg_erp__units
    description: "Units of measure and their conversion to a base unit."
    columns:
      - name: unit_key
        tests: [unique, not_null]

  - name: stg_erp__purchases
    description: "Purchases (supplier invoices). Grain: one row per purchase per tenant."
    columns:
      - name: purchase_key
        tests: [unique, not_null]

  - name: stg_erp__purchase_details
    description: "Purchase lines. Grain: one row per product line on a purchase."
    columns:
      - name: purchase_line_key
        tests: [unique, not_null]
      - name: purchase_key
        tests:
          - relationships: {to: ref('stg_erp__purchases'), field: purchase_key}

  - name: stg_erp__providers
    description: "Suppliers. Personal data removed (ADR 0003)."
    columns:
      - name: supplier_key
        tests: [unique, not_null]

  - name: stg_erp__productions
    description: "Production batches. Grain: one row per batch per tenant."
    columns:
      - name: production_key
        tests: [unique, not_null]

  - name: stg_erp__production_outputs
    description: "Finished products made per batch."
    columns:
      - name: production_output_key
        tests: [unique, not_null]

  - name: stg_erp__production_inputs
    description: "Raw materials consumed per batch, with cost."
    columns:
      - name: production_input_key
        tests: [unique, not_null]

  - name: stg_erp__production_wastes
    description: "Raw material wasted per batch."
    columns:
      - name: production_waste_key
        tests: [unique, not_null]

  - name: stg_erp__production_modules
    description: "Production modules (recipes / lines)."
    columns:
      - name: production_module_key
        tests: [unique, not_null]

  - name: stg_erp__shifts
    description: "Work shifts."
    columns:
      - name: shift_key
        tests: [unique, not_null]
