# Local MariaDB for Project 1 (data discovery).
# Matches the source server version (MariaDB 11.4). Reachable from this computer only.
services:
  mariadb:
    image: mariadb:11.4
    container_name: fortix-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./data:/project_data:ro
      - ./sql/setup:/setup:ro
      - ./sql:/sql:ro
      - ./data/processed:/output
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:
