# Local MariaDB (source copy) + Postgres (analytics warehouse).
# Local MariaDB for Project 1 (data discovery).
# Matches the source server version (MariaDB 11.4). Reachable from this computer only.
services:
  mariadb:
    image: mariadb:11.4
    container_name: fortix-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./data:/project_data:ro
      - ./sql/setup:/setup:ro
      - ./sql:/sql:ro
      - ./data/processed:/output
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    container_name: fortix-warehouse
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER:-fortix}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:?Set WAREHOUSE_PASSWORD in .env}
      POSTGRES_DB: ${WAREHOUSE_DATABASE:-fortix_warehouse}
    ports:
      - "127.0.0.1:${WAREHOUSE_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-fortix} -d ${WAREHOUSE_DATABASE:-fortix_warehouse}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:
  postgres_data:
